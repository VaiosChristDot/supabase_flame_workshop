name: slides
description: "Slide deck for the Flame and Supabase multiplayer workshop."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_deck: ^0.29.0
  flutter_deck_web_client: ^0.4.0
  google_fonts: ^9.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
